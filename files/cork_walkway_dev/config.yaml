# 코르크 산책로 시공 예상도 설정
# 사용자 설정·로그는 %APPDATA%\CorkWalkway\ 에 저장된다.
paths:
  models: models                 # ONNX 모델 폴더
  materials: materials/cork      # 코르크 프리셋·제품 사진 폴더
  output_default: ""             # 비우면 저장할 때 폴더 선택

segmentation:
  encoder: mobile_sam_image_encoder.onnx   # models/ 안의 인코더 파일명
  decoder: sam_mask_decoder_multi.onnx     # models/ 안의 디코더 파일명
  min_area_ratio: 0.002          # 이보다 작은 조각·구멍 정리

render:
  max_preview_px: 1600           # 미리보기 긴 변(px)

gemini:
  enabled: false                 # 외부 전송 사용 여부. 사용자가 [설정]에서 켠다(간편 모드의 자동 변환에 필요)
  # 2026-11-05 실제 키로 확인: models.get 성공, generateContent 요청이 이 모델 기준 할당량 검사까지 도달.
  #   무료 등급 프로젝트는 이 모델 할당량이 0이므로 결제(Billing)가 연결된 프로젝트의 키가 필요하다.
  #   이미지 생성 성공 응답은 결제 연결 후 다시 확인할 것(대안: gemini-3.1-flash-image, 지원 중단 예고됨).
  model: gemini-nano-banana-2.1
  timeout_s: 60                  # 요청당 시간 제한(초)
  max_send_px: 1536              # 전송 이미지 긴 변 상한

export:
  watermark: true                # "가상 시공 예상도" 표기
  jpeg_quality: 92
  image_format: jpg              # jpg 또는 png(png는 무손실: 길 밖 픽셀이 원본과 완전히 같음)
  formats: [after, compare, pdf, settings]   # 시공 후, 전·후 비교, PDF, 작업 설정 JSON+마스크
